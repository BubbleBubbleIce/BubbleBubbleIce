name: Update profile stats

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - .github/workflows/update-profile-stats.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&card_width=467&show_icons=true&bg_color=262624&title_color=D97757&icon_color=D97757&text_color=F0EEE6&border_color=3A3834&hide_border=true"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&card_width=300&langs_count=6&bg_color=262624&title_color=D97757&text_color=F0EEE6&border_color=3A3834&hide_border=true"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub trophy card
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: gruvbox

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/github-trophy.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile stats"
          git push
